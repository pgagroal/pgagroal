#
# DATABASE=ALIAS1,ALIAS2 USER MAX_SIZE INITIAL_SIZE MIN_SIZE
#
# The transaction pipeline cannot create a backend after startup (#344), so a
# backend discarded by test_transaction_disconnect_discards_stale_backend is
# gone for the rest of this configuration's test run. The load testcases open
# six concurrent clients, so prefill one spare: after the regression test
# discards one backend, six remain for the rest of the suite.
#
mydb=pgalias1,pgalias2 myuser 7 7 1
utf8db utf8user 2 2 1
